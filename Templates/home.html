<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cyberbullying Detection</title>

    <!-- ✅ Bootstrap CDN for responsive design -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: url('https://images.unsplash.com/photo-1603791440384-56cd371ee9a7') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
            margin: 0;
            padding: 0;
        }

        /* Navbar styling */
        .navbar {
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px; /* controls spacing between buttons */
        }

        .navbar a {
            background: #ff9800;
            color: #fff;
            padding: 8px 18px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            transition: background 0.3s ease;
        }

        .navbar a:hover {
            background: #e68900;
        }

        /* Main container */
        .container {
            background: rgba(0, 0, 0, 0.6);
            padding: 40px;
            margin: 80px auto;
            width: 70%;
            border-radius: 10px;
            text-align: center;
        }

        h1 {
            color: #ff9800;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <!-- Navigation Bar -->
    <div class="navbar d-flex justify-content-center align-items-center gap-2">
        <a href="{{ url_for('home') }}">Home</a>
        <a href="{{ url_for('about') }}">About</a>
        <a href="{{ url_for('signup') }}">Sign Up</a>
        <a href="{{ url_for('login') }}">Login</a>
    </div>

    <!-- Main Content -->
    <div class="container">
        <h1>Cyberbullying Detection System</h1>
        <p>This website helps identify and prevent harmful online behavior using machine learning.</p>
    </div>

    <!-- ✅ Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
